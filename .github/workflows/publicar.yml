name: Publicar en Cloudflare Pages
# Cada cambio en main se publica solo en https://plazafija.pages.dev
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publicar
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0ebca52ceb14a03bb71254856df434de
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Comprobar la clave de Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Falta el secreto CLOUDFLARE_API_TOKEN en GitHub (Settings → Secrets and variables → Actions)"; exit 1; fi
      - name: Generar la web
        env:
          OWNER_NAME: ${{ secrets.OWNER_NAME }}
          OWNER_NIF: ${{ secrets.OWNER_NIF }}
          OWNER_ADDRESS: ${{ secrets.OWNER_ADDRESS }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: node build.mjs && node test.mjs
      - name: Crear el proyecto (solo la primera vez)
        run: npx --yes wrangler@3 pages project create plazafija --production-branch main || true
      - name: Publicar
        run: npx --yes wrangler@3 pages deploy dist --project-name plazafija --branch main --commit-dirty=true
