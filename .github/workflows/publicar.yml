name: Publicar en Cloudflare Pages
# Cada cambio en main se publica solo en https://plazafija-34s.pages.dev
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publicar
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0ebca52ceb14a03bb71254856df434de
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Comprobar la clave de Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Falta el secreto CLOUDFLARE_API_TOKEN en GitHub (Settings → Secrets and variables → Actions)"; exit 1; fi
      - name: Generar la web
        env:
          OWNER_NAME: ${{ secrets.OWNER_NAME }}
          OWNER_NIF: ${{ secrets.OWNER_NIF }}
          OWNER_ADDRESS: ${{ secrets.OWNER_ADDRESS }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: node build.mjs && node test.mjs
      - name: Crear el proyecto (solo la primera vez)
        run: npx --yes wrangler@3 pages project create plazafija --production-branch main || true
      - name: Contador de visitas (almacén KV y avisos por Telegram)
        # Si falta algo, se avisa en el registro pero la web se publica igual
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          buscar() { npx --yes wrangler@3 kv namespace list | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s.slice(s.indexOf("[")));const n=a.find(x=>/^(plazafija-)?visitas$/.test(x.title));if(n)console.error("Almacén: "+n.title);console.log(n?n.id:"")}catch{console.log("")}})'; }
          id=$(buscar)
          if [ -z "$id" ]; then npx --yes wrangler@3 kv namespace create visitas || true; id=$(buscar); fi
          if [ -n "$id" ]; then
            printf '\n[[kv_namespaces]]\nbinding = "VISITAS"\nid = "%s"\n' "$id" >> wrangler.toml
            echo "Contador de visitas: almacén listo"
          else
            echo "::warning::No se pudo crear el almacén del contador. Añade al token de Cloudflare el permiso Workers KV Storage → Edit."
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            printf '%s' "$TELEGRAM_BOT_TOKEN" | npx --yes wrangler@3 pages secret put TELEGRAM_BOT_TOKEN --project-name plazafija
            printf '%s' "$TELEGRAM_CHAT_ID" | npx --yes wrangler@3 pages secret put TELEGRAM_CHAT_ID --project-name plazafija
            echo "Avisos de Telegram: activados"
          else
            echo "::warning::Faltan los secretos TELEGRAM_BOT_TOKEN y TELEGRAM_CHAT_ID en GitHub: no se enviarán avisos de visitas."
          fi
      - name: Publicar
        run: npx --yes wrangler@3 pages deploy dist --project-name plazafija --branch main --commit-dirty=true
